[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/vault",
  "crates/providers",
  "crates/mcp",
  "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Quisum contributors"]
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
